<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi POS Modern Lengkap</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --danger: #EF4444;
            --success: #10B981;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
        }

        h2 { text-align: center; margin-bottom: 20px; color: var(--primary); }

        .container { 
            display: flex; 
            gap: 20px; 
            max-width: 1200px;
            margin: 0 auto;
            align-items: flex-start;
        }

        .panel { 
            flex: 1; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }

        /* Navigasi Kategori & Pencarian */
        .tools-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-bar {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
        }

        .category-filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .btn-category {
            background-color: #E5E7EB;
            color: var(--text);
            padding: 6px 12px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        
        .btn-category.active {
            background-color: var(--primary);
            color: white;
        }

        /* Katalog Produk */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .product-card {
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .product-card:hover:not(.out-of-stock) {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }

        .product-card.out-of-stock {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #f9f9f9;
        }

        .product-name { font-weight: bold; margin-bottom: 5px; font-size: 15px;}
        .product-price { color: var(--success); font-weight: bold; }
        .product-stock { font-size: 12px; color: #6b7280; margin-top: 5px;}

        /* Tabel Keranjang */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px;}
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #E5E7EB; }
        th { background-color: #F9FAFB; font-weight: 600; }
        
        /* Input Kasir */
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 14px;
        }
        .input-group input {
            width: 100px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: right;
        }

        /* Tombol */
        button {
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            color: white;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        .btn-delete { background-color: var(--danger); padding: 5px 8px; font-size: 11px; }
        .btn-checkout { background-color: var(--success); width: 100%; padding: 12px; margin-top: 15px; font-size: 16px;}
        .btn-reset { background-color: var(--danger); width: 100%; padding: 10px; margin-top: 10px; font-size: 14px;}

        .summary-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #E5E7EB;
        }

        .grand-total {
            text-align: right;
            font-size: 20px;
            margin-top: 10px;
            color: var(--primary);
        }

        .payment-section {
            background-color: #F9FAFB;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        /* Pengaturan Cetak (Print) */
        @media print {
            body { background: white; padding: 0; color: black;}
            .container { display: block; }
            .panel:first-child { display: none; } /* Sembunyikan katalog */
            .panel { box-shadow: none; border: none; padding: 0; width: 100%; max-width: 300px; margin: 0 auto; }
            .btn-checkout, .btn-reset, .btn-delete, th:last-child, td:last-child, .payment-section input { display: none; }
            .tools-header, h2 { display: none; }
            .input-group input { border: none; background: transparent; padding: 0;}
        }
    </style>
</head>
<body>

    <h2>Terminal POS Kasir Modern</h2>
    
    <div class="container">
        <div class="panel">
            <div class="tools-header">
                <input type="text" id="search-bar" class="search-bar" placeholder="🔍 Cari nama produk..." onkeyup="renderKatalog()">
                <div class="category-filters" id="kategori-container">
                    </div>
            </div>

            <div class="product-grid" id="katalog-produk">
                </div>
        </div>

        <div class="panel" id="area-nota">
            <h3 style="text-align: center; margin-top: 0;">Nota Belanja</h3>
            <p style="text-align: center; color: #6b7280; font-size: 12px; margin-bottom: 20px;" id="waktu-transaksi"></p>
            
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Qty</th>
                        <th>Subtotal</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabel-keranjang">
                    </tbody>
            </table>
            
            <div class="summary-section">
                <div class="input-group">
                    <span>Subtotal Harga:</span>
                    <span id="subtotal-harga">Rp 0</span>
                </div>
                <div class="input-group">
                    <span>Diskon (Rp):</span>
                    <input type="number" id="input-diskon" value="0" min="0" onkeyup="kalkulasiTotal()" onchange="kalkulasiTotal()">
                </div>
                <div class="input-group">
                    <span>Pajak PPN (%):</span>
                    <input type="number" id="input-pajak" value="0" min="0" onkeyup="kalkulasiTotal()" onchange="kalkulasiTotal()">
                </div>
                
                <div class="grand-total">
                    <strong>Total Akhir: <span id="total-akhir">Rp 0</span></strong>
                </div>
            </div>

            <div class="payment-section">
                <div class="input-group" style="font-weight: bold;">
                    <span>Tunai (Rp):</span>
                    <input type="number" id="input-bayar" value="" min="0" placeholder="0" onkeyup="hitungKembalian()" onchange="hitungKembalian()">
                </div>
                <div class="input-group" style="color: var(--success); font-weight: bold; font-size: 16px;">
                    <span>Kembalian:</span>
                    <span id="kembalian">Rp 0</span>
                </div>
            </div>

            <button class="btn-checkout" onclick="selesaikanTransaksi()">✅ Selesaikan & Cetak</button>
            <button class="btn-reset" onclick="kosongkanKeranjang(false)">🗑️ Batalkan Transaksi</button>
        </div>
    </div>

    <script>
        // 1 & 5. Database Produk (Dengan Kategori dan Stok)
        const databaseAwal = [
            { id: 1, nama: 'Kopi Susu', harga: 15000, ikon: '☕', kategori: 'Minuman', stok: 20 },
            { id: 2, nama: 'Roti Bakar', harga: 12000, ikon: '🍞', kategori: 'Makanan', stok: 15 },
            { id: 3, nama: 'Es Teh Manis', harga: 5000, ikon: '🍹', kategori: 'Minuman', stok: 30 },
            { id: 4, nama: 'Mie Goreng', harga: 18000, ikon: '🍜', kategori: 'Makanan', stok: 10 },
            { id: 5, nama: 'Nasi Goreng', harga: 20000, ikon: '🍛', kategori: 'Makanan', stok: 8 },
            { id: 6, nama: 'Kentang Goreng', harga: 10000, ikon: '🍟', kategori: 'Cemilan', stok: 12 },
            { id: 7, nama: 'Keripik Pedas', harga: 8000, ikon: '🌶️', kategori: 'Cemilan', stok: 0 } // Contoh stok habis
        ];

        // 4. Local Storage Setup
        let daftarProduk = JSON.parse(localStorage.getItem('pos_produk')) || databaseAwal;
        let keranjang = JSON.parse(localStorage.getItem('pos_keranjang')) || [];
        
        let kategoriAktif = 'Semua';
        let grandTotal = 0; // Disimpan global untuk perhitungan kembalian

        // Format angka ke Rupiah
        const formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID').format(angka);
        };

        // --- RENDER FILTER KATEGORI ---
        function renderKategori() {
            const container = document.getElementById('kategori-container');
            const kategoriUnik = ['Semua', ...new Set(daftarProduk.map(p => p.kategori))];
            
            container.innerHTML = '';
            kategoriUnik.forEach(kat => {
                const btn = document.createElement('button');
                btn.className = `btn-category ${kat === kategoriAktif ? 'active' : ''}`;
                btn.innerText = kat;
                btn.onclick = () => {
                    kategoriAktif = kat;
                    renderKategori(); // Refresh status tombol
                    renderKatalog();  // Refresh produk
                };
                container.appendChild(btn);
            });
        }

        // --- RENDER KATALOG PRODUK ---
        function renderKatalog() {
            const wadahKatalog = document.getElementById('katalog-produk');
            const keyword = document.getElementById('search-bar').value.toLowerCase();
            wadahKatalog.innerHTML = '';

            // Filter berdasarkan kategori & pencarian
            const produkTampil = daftarProduk.filter(p => {
                const cocokKategori = kategoriAktif === 'Semua' || p.kategori === kategoriAktif;
                const cocokKeyword = p.nama.toLowerCase().includes(keyword);
                return cocokKategori && cocokKeyword;
            });

            produkTampil.forEach(produk => {
                const card = document.createElement('div');
                const isHabis = produk.stok <= 0;
                
                card.className = `product-card ${isHabis ? 'out-of-stock' : ''}`;
                // Nonaktifkan klik jika stok habis
                if (!isHabis) {
                    card.onclick = () => tambahKeKeranjang(produk.id);
                }

                card.innerHTML = `
                    <div style="font-size: 30px; margin-bottom: 5px;">${produk.ikon}</div>
                    <div class="product-name">${produk.nama}</div>
                    <div class="product-price">Rp ${formatRupiah(produk.harga)}</div>
                    <div class="product-stock">${isHabis ? '❌ Stok Habis' : 'Stok: ' + produk.stok}</div>
                `;
                wadahKatalog.appendChild(card);
            });
        }

        // --- LOGIKA KERANJANG BELANJA ---
        function tambahKeKeranjang(idProduk) {
            const produk = daftarProduk.find(p => p.id === idProduk);
            const itemDiKeranjang = keranjang.find(item => item.id === idProduk);
            const qtySaatIni = itemDiKeranjang ? itemDiKeranjang.qty : 0;

            // Validasi Stok
            if (qtySaatIni + 1 > produk.stok) {
                alert(`Maaf, sisa stok ${produk.nama} hanya ${produk.stok}!`);
                return;
            }

            if (itemDiKeranjang) {
                itemDiKeranjang.qty += 1;
            } else {
                keranjang.push({ id: produk.id, nama: produk.nama, harga: produk.harga, qty: 1 });
            }
            
            simpanKeStorage();
            perbaruiTampilanKeranjang();
        }

        function hapusItem(idProduk) {
            keranjang = keranjang.filter(item => item.id !== idProduk);
            simpanKeStorage();
            perbaruiTampilanKeranjang();
        }

        function kosongkanKeranjang(isCheckout = false) {
            if(keranjang.length === 0) return;
            
            if(isCheckout || confirm("Apakah Anda yakin ingin membatalkan transaksi ini?")) {
                keranjang = [];
                document.getElementById('input-diskon').value = 0;
                document.getElementById('input-pajak').value = 0;
                document.getElementById('input-bayar').value = '';
                simpanKeStorage();
                perbaruiTampilanKeranjang();
            }
        }

        function perbaruiTampilanKeranjang() {
            const tabelBody = document.getElementById('tabel-keranjang');
            tabelBody.innerHTML = ''; 
            let subtotal = 0;

            keranjang.forEach(item => {
                const totalItem = item.harga * item.qty;
                subtotal += totalItem;

                const baris = tabelBody.insertRow();
                baris.innerHTML = `
                    <td>${item.nama}</td>
                    <td>${item.qty}</td>
                    <td>Rp ${formatRupiah(totalItem)}</td>
                    <td><button class="btn-delete" onclick="hapusItem(${item.id})">X</button></td>
                `;
            });

            document.getElementById('subtotal-harga').innerText = `Rp ${formatRupiah(subtotal)}`;
            document.getElementById('waktu-transaksi').innerText = new Date().toLocaleString('id-ID');
            
            kalkulasiTotal(subtotal);
        }

        // --- KALKULASI DISKON, PAJAK & TOTAL ---
        function kalkulasiTotal(sub = null) {
            // Jika dipanggil langsung dari input, hitung ulang subtotal
            let subtotal = sub;
            if (subtotal === null) {
                subtotal = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
            }

            const diskon = parseFloat(document.getElementById('input-diskon').value) || 0;
            const pajakPersen = parseFloat(document.getElementById('input-pajak').value) || 0;

            let totalSetelahDiskon = subtotal - diskon;
            if (totalSetelahDiskon < 0) totalSetelahDiskon = 0; // Cegah minus

            const nominalPajak = totalSetelahDiskon * (pajakPersen / 100);
            grandTotal = totalSetelahDiskon + nominalPajak;

            document.getElementById('total-akhir').innerText = `Rp ${formatRupiah(grandTotal)}`;
            hitungKembalian(); // Update kembalian otomatis jika total berubah
        }

        // --- PEMBAYARAN & KEMBALIAN ---
        function hitungKembalian() {
            const bayar = parseFloat(document.getElementById('input-bayar').value) || 0;
            let kembalian = bayar - grandTotal;
            
            const elKembalian = document.getElementById('kembalian');
            if (kembalian < 0) {
                elKembalian.innerText = "Uang Kurang!";
                elKembalian.style.color = "var(--danger)";
            } else {
                elKembalian.innerText = `Rp ${formatRupiah(kembalian)}`;
                elKembalian.style.color = "var(--success)";
            }
        }

        function selesaikanTransaksi() {
            if(keranjang.length === 0) return alert("Keranjang kosong!");
            
            const bayar = parseFloat(document.getElementById('input-bayar').value) || 0;
            if (bayar < grandTotal) {
                return alert("Transaksi gagal: Uang pembayaran tidak mencukupi!");
            }

            // Kurangi stok di database produk
            keranjang.forEach(itemBeli => {
                const produkAsli = daftarProduk.find(p => p.id === itemBeli.id);
                if (produkAsli) produkAsli.stok -= itemBeli.qty;
            });

            // Cetak struk
            window.print();

            // Simpan perubahan stok dan kosongkan keranjang
            simpanKeStorage();
            kosongkanKeranjang(true);
            renderKatalog(); // Render ulang agar info stok di layar diperbarui
        }

        // --- PENYIMPANAN LOCAL STORAGE ---
        function simpanKeStorage() {
            localStorage.setItem('pos_keranjang', JSON.stringify(keranjang));
            localStorage.setItem('pos_produk', JSON.stringify(daftarProduk));
        }

        // Inisialisasi awal saat halaman dimuat
        renderKategori();
        renderKatalog();
        perbaruiTampilanKeranjang();
    </script>
</body>
</html>
