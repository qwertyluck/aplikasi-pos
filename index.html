<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi POS Sederhana</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { display: flex; gap: 20px; }
        .panel { flex: 1; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h2>Aplikasi Kasir / Nota Sederhana</h2>
    <div class="container">
        <div class="panel">
            <h3>Pilih Produk</h3>
            <button onclick="tambahItem('Kopi Susu', 15000)">Tambah Kopi Susu (Rp 15.000)</button><br><br>
            <button onclick="tambahItem('Roti Bakar', 10000)">Tambah Roti Bakar (Rp 10.000)</button>
        </div>

        <div class="panel">
            <h3>Nota Belanja</h3>
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Harga</th>
                    </tr>
                </thead>
                <tbody id="tabel-keranjang">
                    </tbody>
            </table>
            <h3>Total: Rp <span id="total-harga">0</span></h3>
        </div>
    </div>

    <script>
        let total = 0;
        let tabelKeranjang = document.getElementById('tabel-keranjang');
        let spanTotal = document.getElementById('total-harga');

        function tambahItem(nama, harga) {
            let row = tabelKeranjang.insertRow();
            row.insertCell(0).innerText = nama;
            row.insertCell(1).innerText = harga.toLocaleString();
            
            total += harga;
            spanTotal.innerText = total.toLocaleString();
        }
    </script>

</body>
</html>
